# Microsoft Recommenders NRMS 기본 설정 (MIND 예제 노트북 examples/00_quick_start/nrms_MIND.ipynb 의 print(hparams) 출력과 같은 값)
# recommenders-team/recommenders @ cc47866b0599721f8544d1cc850a5a1db091acb3
# 파일 경로(wordEmb_file, wordDict_file, userDict_file)는 run_nrms.py 가 채운다.
data:
  title_size: 30
  his_size: 50
  data_format: news
  npratio: 4
info:
  metrics: [group_auc, mean_mrr, ndcg@5;10]
  show_step: 10
model:
  attention_hidden_dim: 200
  word_emb_dim: 300
  dropout: 0.2
  head_num: 20
  head_dim: 20
  model_type: nrms
train:
  batch_size: 32
  epochs: 5
  learning_rate: 0.0001
  loss: cross_entropy_loss
  optimizer: adam
  support_quick_scoring: true
